version: '3.8'

services:
  # Cloudflare WARP proxy - routes yt-dlp traffic through Cloudflare's network
  # This bypasses YouTube's datacenter IP blocking
  warp-proxy:
    image: seiry/cloudflare-warp-proxy:latest
    container_name: melodl-warp-proxy
    ports:
      - "40000:40000"
    restart: unless-stopped
    environment:
      - TZ=UTC
    logging:
      driver: json-file
      options:
        max-size: 1m

  # Your backend server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melodl-backend
    ports:
      - "3001:3001"
    restart: unless-stopped
    depends_on:
      - warp-proxy
    environment:
      - PORT=3001
      - WARP_PROXY=socks5h://warp-proxy:40000
    logging:
      driver: json-file
      options:
        max-size: 5m
